      icon: "fab fa-fw fa-tiktok"
      url: "https://www.tiktok.com/@seeknay747"
    - label: "YouTube"
      icon: "fab fa-fw fa-youtube"
      url: "https://www.youtube.com/@Seeknay747"
    - label: "Instagram"
      icon: "fab fa-fw fa-instagram"
      url: "https://www.instagram.com/seeknay747"
    - label: "Bluesky"
      icon: "fab fa-fw fa-bluesky"
      url: "https://bsky.app/profile/seeknay.com"
    - label: "Twitter"
      icon: "fab fa-fw fa-twitter-square"
      url: "https://twitter.com/seeknay"
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/pbuffolino"
    - label: "Website"
      icon: "fas fa-fw fa-link"
      url: "https://seeknay.com"

footer:
  links:
    - label: "TikTok"
      icon: "fab fa-fw fa-tiktok"
      url: "https://www.tiktok.com/@seeknay747"
    - label: "YouTube"
      icon: "fab fa-fw fa-youtube"
      url: "https://www.youtube.com/@Seeknay747"
    - label: "Instagram"
      icon: "fab fa-fw fa-instagram"
      url: "https://www.instagram.com/seeknay747"
    - label: "Bluesky"
      icon: "fab fa-fw fa-bluesky"
      url: "https://bsky.app/profile/seeknay.com"
    - label: "Twitter"
      icon: "fab fa-fw fa-twitter-square"
      url: "https://twitter.com/seeknay"
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/pbuffolino"
    - label: "Buy me a Coffee!"
      icon: "fa-solid fa-mug-saucer"
      url: "https://www.buymeacoffee.com/seeknay"

defaults:
  # _posts
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: false
      share: true
      related: true
      classes: wide
  # _pages
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true
      classes: wide

category_archive:
  type: liquid
  path: /categories/

tag_archive:
  type: liquid
  path: /tags/
