name: Dependabot auto-merge

# Auto-enable native auto-merge on Dependabot PRs. GitHub then merges each PR
# automatically once the required status check ("build") passes — CI is the gate.
on: pull_request_target

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    steps:
      # pull_request_target runs with a write-capable token (Dependabot PRs are
      # otherwise read-only). This job never checks out PR code, so it is safe.
      - name: Enable auto-merge (squash)
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
