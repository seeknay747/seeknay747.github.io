name: Test Jekyll Build

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

# Least privilege: this workflow only needs to read the repo.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

    - name: Setup Ruby
      uses: ruby/setup-ruby@9eb537ca036ebaed86729dcb9309076e4c5c3b74 # v1.314.0
      with:
        ruby-version: '3.3'
        bundler-cache: true     # runs 'bundle install' and caches installed gems automatically

    - name: Check front matter
      run: ruby script/check_front_matter.rb

    - name: Build with Jekyll (production parity)
      run: bundle exec jekyll build
      env:
        JEKYLL_ENV: production

    - name: Validate HTML, links & images (HTML-Proofer)
      run: |
        bundle exec htmlproofer ./_site \
          --disable-external \
          --allow-hash-href \
          --swap-urls "(^https://seeknay\.com):"
