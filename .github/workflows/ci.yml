name: Test Jekyll Build

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

# Least privilege: this workflow only needs to read the repo.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.3'
        bundler-cache: true     # runs 'bundle install' and caches installed gems automatically

    - name: Check front matter
      run: ruby script/check_front_matter.rb

    - name: Build with Jekyll (production parity)
      run: bundle exec jekyll build
      env:
        JEKYLL_ENV: production

    - name: Build for link check (root-relative URLs)
      run: bundle exec jekyll build --config _config.yml,_config_proofer.yml
      env:
        JEKYLL_ENV: production

    - name: Validate HTML, links & images (HTML-Proofer)
      run: |
        bundle exec htmlproofer ./_site \
          --disable-external \
          --allow-hash-href \
          --allow-missing-href \
          --ignore-missing-alt
